name: E2E Tests - Playwright
permissions:
  contents: read

on:
  # pull_request:
  # Heroku posts a deployment status when a deploy finishes: checkout-web-app-staging (merge to
  # `staging`) and checkout-web-sample-app (merge to `main`). The tests run once the deploy succeeds.
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: 'App to test'
        type: choice
        options:
          - staging
          - production
        default: staging
  schedule:
    # Run at 06:00 UTC daily
    - cron: '0 6 * * *'

env:
  STAGING_APP_ORIGIN: https://checkout.spreedly-demo.dev
  PRODUCTION_APP_ORIGIN: https://checkout.spreedly-demo.app

jobs:
  test:
    # Deployment statuses: only a successful deploy of the staging or production app.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["checkout-web-app-staging", "checkout-web-sample-app"]'), github.event.deployment.environment))
    runs-on: ubuntu-24.04

    concurrency:
      group: e2e-${{ (github.event.deployment.environment == 'checkout-web-app-staging' || inputs.target == 'staging') && 'staging' || 'production' }}
      cancel-in-progress: false

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Select the app to test
      id: target
      env:
        TARGET: ${{ (github.event.deployment.environment == 'checkout-web-app-staging' || inputs.target == 'staging') && 'staging' || 'production' }}
        E2E_BASIC_AUTH_USER: ${{ secrets.E2E_BASIC_AUTH_USER }}
        E2E_BASIC_AUTH_PASSWORD: ${{ secrets.E2E_BASIC_AUTH_PASSWORD }}
      run: |
        if [ "$TARGET" = staging ]; then
          # The staging app is behind a login; without it every page answers 401.
          if [ -z "$E2E_BASIC_AUTH_USER" ] || [ -z "$E2E_BASIC_AUTH_PASSWORD" ]; then
            echo "::error::Set the E2E_BASIC_AUTH_USER and E2E_BASIC_AUTH_PASSWORD secrets to the staging app's BASIC_AUTH_USER and BASIC_AUTH_PASSWORD."
            exit 1
          fi
          echo "origin=$STAGING_APP_ORIGIN" >> "$GITHUB_OUTPUT"
        else
          echo "origin=$PRODUCTION_APP_ORIGIN" >> "$GITHUB_OUTPUT"
        fi
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"
        echo "Testing $TARGET at the commit ${GITHUB_SHA}"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npm run test:install

    - name: Run E2E tests
      env:
        PUBLIC_APP_ORIGIN: ${{ steps.target.outputs.origin }}
        E2E_BASIC_AUTH_USER: ${{ steps.target.outputs.target == 'staging' && secrets.E2E_BASIC_AUTH_USER || '' }}
        E2E_BASIC_AUTH_PASSWORD: ${{ steps.target.outputs.target == 'staging' && secrets.E2E_BASIC_AUTH_PASSWORD || '' }}
        PAYPAL_USER_ID: ${{ secrets.PAYPAL_USER_ID }}
        PAYPAL_USER_PASSWORD: ${{ secrets.PAYPAL_USER_PASSWORD }}
        VENMO_USER_ID: ${{ secrets.VENMO_USER_ID }}
        VENMO_USER_PASSWORD: ${{ secrets.VENMO_USER_PASSWORD }}
      run: npm run test:e2e

    - name: Upload test results to Datadog
      if: always()
      env:
        DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
        DATADOG_APP_KEY: ${{ secrets.DD_APP_KEY }}
        DATADOG_SITE: datadoghq.com
        TARGET: ${{ steps.target.outputs.target }}
      run: |
        # Validate environment variables
        if [ -z "$DATADOG_API_KEY" ] || [ -z "$DATADOG_APP_KEY" ]; then
          echo "Warning: Datadog credentials not found. Skipping test result upload."
          echo "Please ensure DD_API_KEY and DD_APP_KEY secrets are configured."
          exit 0
        fi
        
        # Validate junit.xml file exists
        if [ ! -f "./playwright-report/junit.xml" ]; then
          echo "Warning: junit.xml file not found. Skipping test result upload."
          echo "Expected file: ./playwright-report/junit.xml"
          if [ -d "./playwright-report" ]; then
            echo "Playwright report directory contents:"
            ls -la ./playwright-report/ | grep -E '\.(xml|junit)' || echo "No XML files found in playwright-report directory"
          else
            echo "Playwright report directory does not exist"
          fi
          exit 0
        fi
        
        # Validate junit.xml file is not empty
        if [ ! -s "./playwright-report/junit.xml" ]; then
          echo "Warning: junit.xml file is empty. Skipping test result upload."
          exit 0
        fi
        
        echo "Uploading test results to Datadog..."
        echo "File size: $(stat -c%s "./playwright-report/junit.xml" 2>/dev/null || stat -f%z "./playwright-report/junit.xml") bytes"
        
        # Upload with retry mechanism
        for attempt in 1 2 3; do
          if npx @datadog/datadog-ci junit upload \
            --service web-sdk-sample-app \
            --tags "project:web-sdk-sample-app,environment:ci,target:${TARGET}" \
            ./playwright-report/junit.xml; then
            echo "Successfully uploaded test results to Datadog (attempt $attempt)"
            break
          else
            echo "Upload attempt $attempt failed"
            if [ $attempt -eq 3 ]; then
              echo "All upload attempts failed. Test results could not be uploaded to Datadog."
              echo "This won't fail the build, but test visibility will be limited."
              exit 0
            fi
            echo "Retrying in $((attempt * 2)) seconds..."
            sleep $((attempt * 2))
          fi
        done
